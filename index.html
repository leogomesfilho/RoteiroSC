<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roteiro Santa Catarina 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="wrap" id="topo">
  <header class="hero" id="hero"></header>

  <section>
    <div class="sec-title"><span class="eyebrow">Resumo</span><h2>Onde vamos ficar</h2></div>
    <div class="cities" id="cities"></div>
  </section>

  <section>
    <div class="sec-title"><span class="eyebrow">Toque num dia para ver os detalhes</span><h2>Os 12 dias</h2></div>
    <nav class="strip" id="strip" aria-label="Dias da viagem"></nav>
    <div class="legend"><span><i style="background:var(--bc)"></i>Balneário Camboriú</span><span><i style="background:var(--po)"></i>Pomerode</span><span><i style="background:var(--pe)"></i>Penha</span></div>
  </section>

  <section>
    <div class="sec-title"><span class="eyebrow">Detalhe</span><h2>Dia a dia</h2></div>
    <div class="days" id="days"></div>
  </section>

  <footer>Roteiro montado a partir da planilha da viagem. Horários de parques e passeios mudam com a temporada: confira nos links antes de sair.</footer>
</div>
<script src="dados.js"></script>
<script src="roteiro.js"></script>
<script>
const R=window.Roteiro, $=id=>document.getElementById(id);
$('hero').innerHTML=R.heroHTML();
$('cities').innerHTML=R.citiesHTML();
$('strip').innerHTML=R.stripHTML();
$('days').innerHTML=R.daysHTML();
R.clima();
</script>
</body>
</html>
