<body>
<div class="wrap" id="topo">

  <section>

    <nav class="strip" id="strip" aria-label="Dias da viagem"></nav>

    <div class="days" id="days"></div>
  </section>

</div>
<script src="dados.js?v=6"></script>
<script src="roteiro.js?v=4"></script>
<script>
const R=window.Roteiro, $=id=>document.getElementById(id);
$('hero').innerHTML=R.heroHTML();
$('cities').innerHTML=R.citiesHTML();

$('days').innerHTML=R.daysHTML();
R.clima();
</script>
